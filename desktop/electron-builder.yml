# electron-builder — só Windows, como combinado.
#
# O alvo é único de propósito: áudio do sistema (`loopback`) só existe no
# Windows, então um .dmg ou um AppImage sem essa parte seria uma promessa que o
# app não cumpre.

appId: com.juntos.watchparty
productName: Juntos
copyright: Juntos

directories:
  output: release
  buildResources: build

# Só o código do app, e nada mais: o `web-standalone` vai por `extraResources`.
files:
  - dist/**/*
  - package.json
  # O ícone entra no asar porque a janela do Electron precisa dele em disco no
  # momento em que é criada, e `createFromPath` do Electron lê de dentro do asar.
  # O caminho relativo em `electron/main/index.ts` resolve igual nos dois modos:
  # em desenvolvimento `__dirname` é `desktop/electron/main`, e empacotado é
  # `app.asar/dist/main` — `../../build/icon.ico` dá `desktop/build` e
  # `app.asar/build` nos dois casos.
  - build/icon.ico

# O servidor web vai para `resources/web-standalone`, **fora** do asar, e por
# dois motivos ao mesmo tempo:
#
# 1. O `node_modules` dele nunca entraria em `files`. O electron-builder filtra
#    a árvore de `node_modules` a partir do `package.json` do app, e esse
#    package não declara nenhuma daquelas dependências. A primeira versão
#    empacotava um `server.js` sem nenhuma dependência ao lado: o app instalava,
#    abria, e o servidor interno morria ao carregar o Next.
#
# 2. Node não consegue `require` de dentro do asar. Mesmo que entrasse, teria de
#    extrair tudo para um temporário antes de usar. Fora do asar, o servidor lê
#    direto do disco.
#
# O caminho é resolvido em `main/localServer.ts`, que olha `app.isPackaged`.
extraResources:
  - from: web-standalone
    to: web-standalone
    filter:
      - "**/*"

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  # Ícone oficial do app, em sete tamanhos (16 a 256). Este é o recurso que o
  # Windows lê em todos os lugares de executável de uma vez: o `Juntos.exe`, o
  # instalador, os atalhos do menu Iniciar e da área de trabalho, e o ícone que
  # a barra de tarefas e o Alt+Tab pegam.
  #
  # O arquivo é gerado por `npm run icon` e versionado, para o build não depender
  # do `sharp` do `web` e para o mesmo arquivo servir à janela do Electron (ver
  # `icon` em `electron/main/index.ts`). Não é o `favicon.ico` do `web/public`:
  # aquele tem 48x48 e sairia borrado na barra de tarefas e no Alt+Tab.
  icon: build/icon.ico
  # `signAndEditExecutable` fica ligado (é o padrão) mesmo sem certificado.
  #
  # Desligar esse flag não é "não assinar": é "não editar o executável". E
  # editar o executável é o passo que grava o ícone, a informação de versão e o
  # manifest da aplicação. Com ele desligado, o `win.icon` acima era ignorado no
  # `Juntos.exe` — o app saía com o átomo do Electron — enquanto o instalador
  # recebia o ícone normalmente, porque o NSIS pega o ícone por outro caminho.
  # Metade do ícone, em parte dos lugares, e nada indicava o porquê.
  #
  # A assinatura é um passo separado, e o electron-builder pula sozinho quando
  # não acha certificado: o log diz "no signing info identified, signing is
  # skipped". O instalador continua aparecendo como "de fonte desconhecida" e o
  # SmartScreen avisa — isso é o preço de não ter certificado, e é o mesmo de
  # antes.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Juntos

# O Next standalone já foi construído com NEXT_TELEMETRY_DISABLED no servidor
# local; estas linhas cobrem o resto da telemetria do Electron.
publish: null
